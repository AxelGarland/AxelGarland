    ctx.save();

    dragX = e.clientX; dragY = e.clientY; dragStart = progress; dragged = false;
  });
  c.elt.addEventListener('pointermove', e => {
    if (dragY === undefined) return;
    dragged ||= Math.hypot(e.clientX-dragX,e.clientY-dragY) > 6;
    /* In the hero, the page scroll drives the stars. */
  });
  c.elt.addEventListener('pointerup', e => {
    if (dragY !== undefined && !dragged) { triggerWince(); selected = !selected; loop(); }
    dragY = undefined;
  });
  c.elt.addEventListener('pointercancel', () => { dragY = undefined; });
  c.elt.addEventListener('wheel', e => {
    scheduleGlance();
    
  }, {passive:true});
  // The red focus ring is for keyboard users only; a click selects the portrait instead.
  document.addEventListener('keydown', e => { if (e.key === 'Tab') document.body.classList.add('kb'); });
  document.addEventListener('pointerdown', () => document.body.classList.remove('kb'), true);
  // Clicking elsewhere on the page clears the selection.
  window.addEventListener('blur', () => { if (selected) { selected = false; redraw(); } });
  // The page tells the sketch how far down the hero it has scrolled (0 to 1).
  window.addEventListener('message', e => {
    if (e.data && e.data.type === 'progress') { playing = false; target = constrain(+e.data.value || 0, 0, 1); loop(); }
  });
  noLoop();
}
function windowResized() {
  const w = Math.min(windowWidth, windowHeight * 1122 / FULL_H);
  resizeCanvas(w, w * FULL_H / 1122);
  if (portrait) redraw();
}
// The painted background is a soft gradient; its outer edge is faded into the page colour so the picture has no border.
function feather() {
  if (CUT) return;
  const ctx = drawingContext, E = PAGE[0] === 255 ? 210 : 150, c = 'rgba(' + PAGE.join(',') + ',';
  const edge = (x0,y0,x1,y1,rx,ry,rw,rh) => { const g = ctx.createLinearGradient(x0,y0,x1,y1); g.addColorStop(0,c+'1)'); g.addColorStop(1,c+'0)'); ctx.fillStyle = g; ctx.fillRect(rx,ry,rw,rh); };
  if (PAGE[0] === 255) edge(0,0,0,30,0,0,1122,30);
  edge(0,1402,0,1402-E,0,1402-E,1122,E);
  edge(0,0,E,0,0,0,E,1402);
  edge(1122,0,1122-E,0,1122-E,0,E,1402);
}
// A thin blue box with square corner handles, like a selected frame.
function drawSelection() {
  const px = 1122 / width, m = 7 * px, h = 5 * px, w = 1122 - 2 * m, ht = 1402 - 2 * m;
  push();
  noFill(); stroke('#2354e6'); strokeWeight(2 * px);
  rect(m, m, w, ht);
  fill(255); strokeWeight(1.5 * px);
  [[m, m], [m + w, m], [m, m + ht], [m + w, m + ht]].forEach(([x, y]) => rect(x - h, y - h, 2 * h, 2 * h));
  pop();
}
function playBeat() { scheduleGlance(); target = target > .5 ? 0 : 1; playing = true; loop(); }
function triggerWince() { scheduleGlance(); winceUntil = millis()+370; loop(); }
function keyPressed() { if (keyCode === ESCAPE && selected) { selected = false; redraw(); return false; }
  if (keyCode === ENTER) {triggerWince(); selected = !selected; loop(); return false;} if (key === ' ') {playBeat(); return false;} }
function prepareLayers() {
  // Extract the actual yellow paint and borrow adjacent blue cloth for the holes.
  shirt = portrait.get(0,1100,1122,250);
  shirt.loadPixels();
  pieces = stars.map(([cx,cy,size]) => {
    const x=cx-size/2, y=cy-size/2, piece=portrait.get(x,y,size,size);
    piece.loadPixels();
    for(let j=0;j<size;j++) for(let i=0;i<size;i++){
      const k=4*(j*size+i), p=piece.pixels;
      const alpha=constrain((p[k]-p[k+2]+18)/90,0,1)*constrain((p[k+1]-75)/55,0,1);
      p[k+3]=255*alpha;
      if(alpha===0) continue;
      const pos=4*((y+j-1100)*1122+x+i);
      const donor=4*((y+j-1100)*1122+x-6+(i%5));
      for(let c=0;c<3;c++) shirt.pixels[pos+c]=lerp(shirt.pixels[pos+c],shirt.pixels[donor+c],alpha);
    }
    piece.updatePixels(); return piece;
  });
  shirt.updatePixels();

}
function draw(){
  if(!portrait || !pieces) return;
  const step=Math.min(deltaTime,50)/(playing?3400:220);
  progress+=constrain(target-progress,-step,step);
  if (CUT) clear(); else background(...PAGE);
  scale(width/1122); translate(0,36); image(portrait,0,0); feather();
  if(progress>0){
    image(shirt,0,1100); feather();
    // A short blink hides the cut to the new gaze, like replacement animation.
    const eyeCel = progress < .265 ? null : gazeFrames[progress < .296 && progress !== target ? 0 : 1];
    if (eyeCel) image(eyeCel,355,339,454,227);
    const mouthCel = progress < .33 ? null : mouthFrames[progress < .39 ? 0 : 1];
    if (mouthCel) image(mouthCel,432,609,382,195);
    if (!NOSTARS) stars.forEach(([cx,cy,size,delay],i)=>{
      const t=constrain((progress-delay)/(1-delay),0,1);
      const dx=Math.sin(t*4+i)*t*50, dy=420*t*t-20*Math.sin(t*PI);
      push(); translate(cx+dx,cy+dy); rotate(t*(i%2?1:-1)*1.4);
      image(pieces[i],-size/2,-size/2); pop();
      if(t>0 && t<1){
        noStroke();
        for(let j=1;j<=4;j++){
          fill(244,180,23,180*(1-t));circle(cx+dx-j*2,cy+dy-j*9*t,6-j);
        }
      }
    });
  }
  const reacting = millis() < winceUntil;
  if (reacting && wince) image(wince,349,335,470,480);
  const age=millis()-glanceStart;
  const glancing=glanceStart>=0 && age<glanceDuration && !reacting;
  if(glancing){
    const phase=constrain(Math.min(age/glanceIn,(glanceDuration-age)/glanceOut),0,1);
    if(phase>0) drawGlance(phase*phase*(3-2*phase));
  }
  if (selected) drawSelection();
  if(progress===target && !reacting && !glancing) noLoop();
}
function mouseWheel(){ loop(); }
function touchMoved(){ loop(); }
function mouseDragged(){ loop(); }
</script></html>
