<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product Designer and Illustrator</title>
<style>
html,body{margin:0;background:transparent;overflow:hidden}
canvas{display:block}
</style></head><body>
<script src="/home/p5.min.js"></script>
<script>
const paper = '#fdebd7'; // the hero's colour
const ink = '#181715';
const cobalt = '#2354e6';
const sceneWidth = 620;
const sceneHeight = 112;
const cards = [
  {label:'Product Designer', x:1, y:16, w:349, h:80, start:600},
  {label:'Illustrator', x:384, y:16, w:235, h:80, start:2370}
];
const restingCursor = [596,109];
let startedAt = 0;

function setup() {
  const surface = createCanvas(Math.min(sceneWidth, windowWidth), 1);
  surface.elt.setAttribute('role','img');
  surface.elt.setAttribute('aria-label','Two text boxes appear and type Product Designer and Illustrator.');
  resizeScene();
  pixelDensity(Math.min(devicePixelRatio,2));
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) startedAt = -4600;
}

function resizeScene() {
  const w = Math.min(sceneWidth, windowWidth);
  resizeCanvas(w, Math.round(w * sceneHeight/sceneWidth));
}
function windowResized() { resizeScene(); }
function replay() { startedAt = millis(); loop(); }

function travel(from, to, fraction) {
  const t = constrain(fraction,0,1);
  const ease = t*t*(3-2*t);
  return [lerp(from[0],to[0],ease),lerp(from[1],to[1],ease)];
}

function drawCard(card, age) {
  const fraction = constrain(age/420,0,1);
  const w = card.w*fraction;
  const h = card.h*fraction;
  const active = age < 1650;
  const count = Math.floor(Math.max(0,age-500)/51);
  const typed = card.label.slice(0,count);
  stroke(cobalt);
  strokeWeight(active ? 1.6 : 1.2);
  noFill();
  rect(card.x,card.y,w,h);
  if (active) {
    fill(paper);
    for (const x of [card.x,card.x+w]) {
      for (const y of [card.y,card.y+h]) rect(x-3,y-3,6,6);
    }
  }
  if (age < 420) return;
  noStroke();
  fill(ink);
  textFont('Arial');
  textStyle(BOLD);
  textSize(31);
  textAlign(LEFT,BASELINE);
  const label = drawingContext.measureText(card.label);
  const textX = card.x + (card.w + label.actualBoundingBoxLeft - label.actualBoundingBoxRight)/2;
  const textY = card.y + (card.h + label.actualBoundingBoxAscent - label.actualBoundingBoxDescent)/2;
  text(typed,textX,textY);
  if (active && (age<950 || Math.floor(age/175)%2===0)) {
    stroke(cobalt);
    strokeWeight(1.5);
    const caret = textX+textWidth(typed)+2;
    line(caret,card.y+20,caret,card.y+card.h-20);
  }
}

function drawCursor(x,y,dragging) {
  push();
  translate(x,y);
  if (dragging) {
    noStroke();
    fill('#2354e624');
    circle(0,0,28);
  }
  stroke(paper);
  strokeWeight(2);
  strokeJoin(ROUND);
  fill(ink);
  beginShape();
  for (const [u,v] of [[0,0],[0,24],[6,18],[11,28],[16,25],[11,16],[20,15]]) vertex(u,v);
  endShape(CLOSE);
  pop();
}

function renderScene(time) {
  clear();
  scale(width/sceneWidth);
  let cursor = [-14,114];
  let dragging = false;
  for (const card of cards) {
    const age = time-card.start;
    const top = [card.x,card.y];
    const corner = [card.x+card.w,card.y+card.h];
    const park = [corner[0]+15,corner[1]+9];
    cursor = travel(cursor,top,(age+450)/450);
    if (age < 0) break;
    drawCard(card,age);
    if (age<420) {
      // Use the actual drag endpoint so the pointer stays attached to the corner.
      cursor = [lerp(top[0],corner[0],age/420),lerp(top[1],corner[1],age/420)];
      dragging = true;
      break;
    }
    cursor = travel(corner,park,(age-420)/210);
  }
  if (time>=4100) cursor=travel(cursor,restingCursor,(time-4100)/340);
}

let told = false;
function draw() {
  const time = millis()-startedAt;
  renderScene(time);
  // Tell the page when both roles are in, so it can bring in what comes next.
  if (!told && time>=3500) { told = true; parent.postMessage({type:'roles-done'},'*'); }
  if (time>=4600) noLoop();
}

</script>
</body></html>
